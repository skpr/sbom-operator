namespace: sbom-system

resources:
  - ../crd
  - ../rbac
  - ../manager

# Settings for the operator. See "sbom operator --help" for all options.
configMapGenerator:
  - name: sbom-operator
    envs:
      - params.env

# Keep in sync with SBOM_SCANNER_IMAGE in params.env.
images:
  - name: sbom-operator
    newName: ghcr.io/skpr/sbom-operator
    newTag: main
