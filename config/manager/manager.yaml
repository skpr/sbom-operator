apiVersion: v1
kind: Namespace
metadata:
  name: sbom-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-operator
  namespace: sbom-system
  labels:
    app.kubernetes.io/name: sbom-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sbom-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbom-operator
    spec:
      serviceAccountName: sbom-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: sbom-operator:latest
          args:
            - operator
            - --leader-elect
          envFrom:
            - configMapRef:
                name: sbom-operator
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
