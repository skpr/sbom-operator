---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sbom-operator
rules:
- apiGroups:
  - security.skpr.io
  resources:
  - sboms
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.skpr.io
  resources:
  - sboms/finalizers
  verbs:
  - update
- apiGroups:
  - security.skpr.io
  resources:
  - sboms/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbom-operator
  namespace: sbom-system
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
