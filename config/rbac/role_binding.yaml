apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sbom-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sbom-operator
subjects:
  - kind: ServiceAccount
    name: sbom-operator
    namespace: sbom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbom-operator
  namespace: sbom-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sbom-operator
subjects:
  - kind: ServiceAccount
    name: sbom-operator
    namespace: sbom-system
