name: 📋 Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v6

      - name: 📦 Install Mise
        uses: jdx/mise-action@v4

      - name: 📋 Lint
        run: mise run lint

  test:
    name: 📋 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v6

      - name: 📦 Install Mise
        uses: jdx/mise-action@v4

      - name: 🧪 Test
        run: mise run test

  generate:
    name: 📋 Generate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v6

      - name: 📦 Install Mise
        uses: jdx/mise-action@v4

      - name: 🏗️ Generate
        run: mise run generate

      - name: 🔍 Check for uncommitted changes
        run: git diff --exit-code

  snapshot:
    name: 📋 Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Install Mise
        uses: jdx/mise-action@v4

      - name: 🏗️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the binaries and image without publishing to check the GoReleaser configuration.
      - name: 🧪 Snapshot
        run: mise run snapshot
