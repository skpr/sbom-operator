project_name: sbom-operator

version: 2

builds:
  - id: sbom-operator
    main: ./cmd/sbom-operator
    binary: sbom-operator
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'
    env:
      - CGO_ENABLED=0
    goos: [ linux ]
    goarch: [ amd64, arm64 ]

  - id: sbom-scanner
    main: ./cmd/sbom-scanner
    binary: sbom-scanner
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'
    env:
      - CGO_ENABLED=0
    goos: [ linux ]
    goarch: [ amd64, arm64 ]

# Both programs ship in one image so the scanner always matches the operator.
dockers_v2:
  - id: sbom-operator
    dockerfile: Dockerfile
    ids:
      - sbom-operator
      - sbom-scanner
    images:
      - "ghcr.io/skpr/sbom-operator"
    tags:
      - "latest"
      - "{{ .Commit }}"
      - "{{ .Tag }}"
    sbom: false
    flags:
      - "--pull"
    platforms:
      - linux/amd64
      - linux/arm64

# Only the image is published, binaries are not attached to the release.
archives:
  - formats: [ none ]

checksum:
  disable: true

release:
  prerelease: auto
  name_template: "SBOM Operator {{.Version}}"
  github:
    owner: skpr
    name: sbom-operator

changelog:
  use: github-native
